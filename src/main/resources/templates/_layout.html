<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      th:lang="${#locale.language}" th:with="theme=${@webSecurityUtil.getCurrentUserTheme()}, themeUrl=${@webSecurityUtil.getBootswatchThemeUrl()}" th:data-bs-theme="${theme}">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">FredBet</title>

		<!-- installable web app (PWA): manifest, icons and the colour of the browser/status bar.
			 The manifest (like sw.js) needs a stable url without content hash, so it is appended to the context root. -->
		<link rel="manifest" th:href="@{/} + 'manifest.json'" />
		<link rel="apple-touch-icon" th:href="@{/pwa/apple-touch-icon.png}" />
		<meta name="theme-color" th:content="${theme == 'dark'} ? '#212529' : '#ffffff'" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="FredBet" />

		<link rel="stylesheet" th:href="@{/webjars/font-awesome/css/fontawesome.min.css}" />
		<link rel="stylesheet" th:href="@{/webjars/font-awesome/css/brands.min.css}" />
		<link rel="stylesheet" th:href="@{/webjars/font-awesome/css/solid.min.css}" />
        <link rel="stylesheet" th:href="@{${themeUrl}}" />
        <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}" />
		<link rel="stylesheet" th:href="@{/webjars/photoswipe/dist/photoswipe.css}" />
		<link rel="stylesheet" th:href="@{/css/image_viewer.css}" />
        <link rel="stylesheet" th:href="@{/webjars/flag-icons/css/flag-icons.min.css}" />
        <link rel="stylesheet" th:href="@{/club-wm-icons/css/club-wm-icons.css}" />
		<link rel="stylesheet" th:href="@{/css/custom.css}" />
	</head>
	<body>
		<nav th:replace="~{_navigation :: menu}"></nav>
		<div class="container mt-3" role="main">
            <div th:replace="~{fragments/alert :: alert_headline}"></div>
			<div layout:fragment="content" th:remove="tag">Content Placeholder</div>
		</div>
		<!-- hint to install FredBet as app on mobile devices, shown by pwa_install.js -->
		<div id="pwaInstallHint" class="pwa-install-hint card shadow d-none" role="dialog"
			 th:data-sw-url="@{/} + 'sw.js'" th:data-sw-scope="@{/}">
			<div class="card-body d-flex align-items-center gap-3 p-3">
				<img th:src="@{/pwa/icon-192.png}" class="pwa-install-icon rounded" alt="" />
				<div class="flex-grow-1 small">
					<span class="pwa-install-default" th:text="#{pwa.install.text}"></span>
					<span class="pwa-install-ios d-none">
						<span th:text="#{pwa.install.text}"></span>
						<span th:text="#{pwa.install.ios}"></span> <i class="bi bi-box-arrow-up" aria-hidden="true"></i>
					</span>
				</div>
				<button type="button" id="pwaInstallButton" class="btn btn-primary btn-sm pwa-install-default" th:text="#{pwa.install.button}">Install</button>
				<button type="button" id="pwaInstallClose" class="btn-close" th:aria-label="#{pwa.install.close}"></button>
			</div>
		</div>
		<!-- jQuery first, then Popper.js, then Bootstrap JS -->
        <script type="text/javascript" th:src="@{/webjars/jquery/jquery.min.js}"></script>
        <script type="text/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
		<!-- translated texts of the image viewer, the data attributes are named like the PhotoSwipe options -->
		<div id="imageViewerTexts" hidden th:data-close-title="#{image.viewer.close}" th:data-zoom-title="#{image.viewer.zoom}"
			 th:data-arrow-prev-title="#{image.viewer.previous}" th:data-arrow-next-title="#{image.viewer.next}"
			 th:data-error-msg="#{image.viewer.error}"></div>
		<script type="text/javascript" th:src="@{/webjars/photoswipe/dist/umd/photoswipe.umd.min.js}"></script>
		<script type="text/javascript" th:src="@{/js/image_viewer.js}"></script>
        <script type="text/javascript" th:src="@{/js/pages/tooltip.js}" charset="UTF-8"></script>
		<script type="text/javascript" th:src="@{/js/pwa_install.js}" charset="UTF-8"></script>
		<th:block layout:fragment="scripts"></th:block>
	</body>
</html>

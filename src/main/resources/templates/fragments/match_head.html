<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:fragment="match_head_list(match)" th:remove="tag">
        <span class="text-nowrap">
            <img class="crest-small" th:src="@{/team/{teamId}.svg(teamId=${match.teamOne.id})}" alt="crests"/>
            <span class="fw-bold" th:text="${match.teamOne.getNameTranslated(@messageSourceUtil)}"></span>
            <span> : </span>
        </span>
        <span class="text-nowrap">
            <img class="crest-small" th:src="@{/team/{teamId}.svg(teamId=${match.teamTwo.id})}" alt="crests"/>
            <span class="fw-bold" th:text="${match.teamTwo.getNameTranslated(@messageSourceUtil)}"></span>
        </span>
	</div>

    <div th:fragment="match_info(match)" class="match-info d-flex flex-wrap column-gap-3 row-gap-1 small text-body-secondary">
        <span class="text-nowrap">
            <i class="fas fa-calendar-day" aria-hidden="true"></i>
            <span th:text="${#temporals.format(match.kickOffDate, 'EEE dd. MMMM yyyy')}"></span>
        </span>
        <span class="text-nowrap">
            <i class="fas fa-clock" aria-hidden="true"></i>
            <span th:text="${#temporals.format(match.kickOffDate, 'HH:mm')}"></span>
        </span>
        <span class="text-nowrap" th:if="${match.group != null}">
            <i class="fas fa-layer-group" aria-hidden="true"></i>
            <span th:text="#{${match.group.titleMsgKey}}"></span>
        </span>
        <span class="text-nowrap" th:if="${!#strings.isEmpty(match.venue)}">
            <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
            <span th:text="${match.venue}"></span>
        </span>
    </div>

    <div th:fragment="match_head_team(team)" th:remove="tag">
        <img class="big-flag" th:src="@{/team/{teamId}.svg(teamId=${team.id})}" alt=""/>
        <span class="teamName" th:text="${team.getNameTranslated(@messageSourceUtil)}"></span>
    </div>
</body>
</html>

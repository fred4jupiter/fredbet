<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:fragment="match_head_list(match)" th:remove="tag">
        <span class="text-nowrap">
            <img class="crest-small" th:src="@{/team/{teamId}.svg(teamId=${match.teamOne.id})}" alt="crests"/>
            <span class="fw-bold" th:text="${match.teamOne.getNameTranslated(@messageSourceUtil)}"></span>
            <span> : </span>
        </span>
        <span class="text-nowrap">
            <img class="crest-small" th:src="@{/team/{teamId}.svg(teamId=${match.teamTwo.id})}" alt="crests"/>
            <span class="fw-bold" th:text="${match.teamTwo.getNameTranslated(@messageSourceUtil)}"></span>
        </span>
	</div>

    <div th:fragment="match_head_detail(match)" class="col-12">
        <div class="match-head">
            <div class="match-head-team">
                <img class="big-flag" th:src="@{/team/{teamId}.svg(teamId=${match.teamOne.id})}" alt=""/>
                <span class="teamName" th:text="${match.teamOne.getNameTranslated(@messageSourceUtil)}"></span>
            </div>
            <span class="match-head-separator" aria-hidden="true">:</span>
            <div class="match-head-team">
                <img class="big-flag" th:src="@{/team/{teamId}.svg(teamId=${match.teamTwo.id})}" alt=""/>
                <span class="teamName" th:text="${match.teamTwo.getNameTranslated(@messageSourceUtil)}"></span>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{_layout}">
	<head>
		<title th:text="#{administration.config.title}"></title>
	</head>
	<body>
		<div layout:fragment="content">
			<h1 th:text="#{administration.config.title}"></h1>

			<div class="row g-3 mb-3">
				<div class="col-12 col-md-6 col-xl-4">
					<form id="changeLogLevelForm" class="h-100" th:action="@{/config/changeLogLevel}" th:object="${configurationCommand}" method="post" role="form">
						<div class="card h-100">
							<div class="card-header">
								<h2 class="h5 mb-0" th:text="#{administration.change.loglevel.title}"></h2>
							</div>
							<div class="list-group list-group-flush">
								<label class="list-group-item list-group-item-action d-flex align-items-center gap-2" th:each="level : ${configurationCommand.logLevel}">
									<input class="form-check-input m-0" type="radio" th:field="*{level}" th:value="${level}" />
									<span th:text="${level}"></span>
								</label>
							</div>
							<div class="card-footer mt-auto">
								<button type="submit" class="btn btn-primary" th:text="#{button.save}"></button>
							</div>
						</div>
					</form>
				</div>

				<div class="col-12 col-md-6 col-xl-4">
					<form id="clearCacheForm" class="h-100" th:action="@{/config/clearCache}" method="post">
						<div class="card h-100">
							<div class="card-header">
								<h2 class="h5 mb-0" th:text="#{administration.cache.title}"></h2>
							</div>
							<div class="card-body">
								<p class="card-text" th:text="#{administration.cache.description}"></p>
							</div>
							<div class="list-group list-group-flush">
								<label class="list-group-item list-group-item-action d-flex align-items-start gap-2" th:each="cacheName : ${cacheNames}" th:with="desc=${#messages.msgOrNull('administration.cache.name.' + cacheName)}">
									<input class="form-check-input mt-1 flex-shrink-0" type="checkbox" name="selectedCaches" th:value="${cacheName}" />
									<span>
										<code th:text="${cacheName}"></code>
										<span class="d-block small text-body-secondary" th:if="${desc != null}" th:text="${desc}"></span>
									</span>
								</label>
							</div>
							<div class="card-footer mt-auto d-flex flex-wrap gap-2">
								<button type="submit" class="btn btn-outline-warning" th:formaction="@{/config/clearSelectedCaches}">
									<i class="bi bi-check2-square"></i> <span th:text="#{administration.clearSelectedCaches}"></span>
								</button>
								<button type="submit" class="btn btn-warning">
									<i class="bi bi-arrow-clockwise"></i> <span th:text="#{administration.clearCache}"></span>
								</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{_layout}">
	<head>
		<title th:text="#{administration.excel.export.title}"></title>
	</head>
	<body>
		<div layout:fragment="content" th:with="exports=${ {'allBets', 'extraBets', 'ranking', 'pointsCount'} }">
			<h1 th:text="#{administration.excel.export.title}"></h1>
			<p class="text-body-secondary" th:text="#{excel.export.hint}"></p>
			<div class="row">
				<div class="col-12 col-md-8 col-lg-6 col-xl-5">
					<!-- the export name is both the URL path and the suffix of the message key -->
					<div class="list-group">
						<a th:each="export : ${exports}" th:href="@{/excelexport/{export}(export=${export})}" download
						   class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
							<i class="fas fa-file-excel fa-lg text-success" aria-hidden="true"></i>
							<span class="flex-grow-1" th:text="#{${'administration.excel.export.' + export}}"></span>
							<i class="fas fa-download text-body-secondary" aria-hidden="true"></i>
						</a>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>

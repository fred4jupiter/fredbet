<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{_layout}">
	<head>
		<title th:text="#{navigation.dataCreation}"></title>
		<link rel="stylesheet" th:href="@{/css/pages/data_creation.css}" />
	</head>
	<body>
		<div layout:fragment="content">
			<h1 th:text="#{navigation.dataCreation}"></h1>
			<div class="row g-3 mb-3">
				<!-- matches with optional bets and results -->
				<div class="col-12 col-lg-6">
					<div class="card h-100">
						<div class="card-header">
							<h2 class="h5 mb-0"><i class="fas fa-futbol me-2" aria-hidden="true"></i><span th:text="#{datacreation.testdata.title}"></span></h2>
						</div>
						<div class="card-body">
							<form id="testDataForm" th:action="@{/administration/testdata}" th:object="${testDataCommand}" action="#" method="post" role="form">
								<div class="mb-3">
									<label for="groupSelection" class="form-label" th:text="#{testdata.numberOfGroups}"></label>
									<select id="groupSelection" th:field="*{groupSelection}" class="form-select">
										<option th:each="groupSelection : ${testDataCommand.groupSelections}" th:value="${groupSelection}" th:text="#{${groupSelection.msgKey}}"></option>
									</select>
								</div>
								<div class="form-check form-switch mb-2">
									<input id="createGameOfThird" type="checkbox" role="switch" th:field="*{createGameOfThird}" class="form-check-input"/>
									<label for="createGameOfThird" class="form-check-label" th:text="#{testdata.createGameOfThird}"></label>
								</div>
								<div class="form-check form-switch mb-2">
									<input id="includeBets" type="checkbox" role="switch" th:field="*{includeBets}" class="form-check-input"/>
									<label for="includeBets" class="form-check-label" th:text="#{testdata.includeBets}"></label>
								</div>
								<div class="form-check form-switch mb-3">
									<input id="includeResults" type="checkbox" role="switch" th:field="*{includeResults}" class="form-check-input"/>
									<label for="includeResults" class="form-check-label" th:text="#{testdata.includeResults}"></label>
								</div>
								<button type="submit" class="btn btn-primary">
									<i class="fas fa-plus" aria-hidden="true"></i> <span th:text="#{datacreation.button.create}"></span>
								</button>
							</form>
						</div>
					</div>
				</div>

				<div class="col-12 col-lg-6 d-flex flex-column gap-3">
					<!-- demo users -->
					<div class="card">
						<div class="card-header">
							<h2 class="h5 mb-0"><i class="fas fa-users me-2" aria-hidden="true"></i><span th:text="#{datacreation.testdemousers.title}"></span></h2>
						</div>
						<div class="card-body">
							<form id="adminForm" th:action="@{/administration/save}" th:object="${adminFormCommand}" action="#" method="post" role="form">
								<label class="form-label" for="numberOfTestUsers" th:text="#{datacreation.numberOfTestUsers.title}"></label>
								<div class="d-flex flex-wrap align-items-start gap-2">
									<div class="data-creation-number">
										<input id="numberOfTestUsers" type="number" min="1" max="100" th:field="*{numberOfTestUsers}" class="form-control" th:errorclass="is-invalid"/>
										<div class="invalid-feedback" th:if="${#fields.hasErrors('numberOfTestUsers')}" th:errors="*{numberOfTestUsers}"></div>
									</div>
									<button type="submit" class="btn btn-primary">
										<i class="fas fa-user-plus" aria-hidden="true"></i> <span th:text="#{datacreation.button.create}"></span>
									</button>
								</div>
							</form>
						</div>
					</div>

					<!-- bets and results for the matches that already exist -->
					<div class="card flex-grow-1">
						<div class="card-header">
							<h2 class="h5 mb-0"><i class="fas fa-magic me-2" aria-hidden="true"></i><span th:text="#{datacreation.existingData.title}"></span></h2>
						</div>
						<div class="card-body d-flex flex-wrap align-items-start gap-2">
							<a class="btn btn-outline-primary" role="button" th:href="@{/administration/createDemoBets}">
								<i class="fas fa-thumbs-up" aria-hidden="true"></i> <span th:text="#{datacreation.demoBetsAllUsers}"></span>
							</a>
							<a class="btn btn-outline-primary" role="button" th:href="@{/administration/createDemoResults}">
								<i class="fas fa-trophy" aria-hidden="true"></i> <span th:text="#{datacreation.testResultsAllUsers}"></span>
							</a>
						</div>
					</div>
				</div>

				<!-- import of matches from a football-data.org JSON file -->
				<div class="col-12 col-lg-6">
					<div class="card h-100">
						<div class="card-header d-flex align-items-center gap-2">
							<h2 class="h5 mb-0 flex-grow-1"><i class="fas fa-file-import me-2" aria-hidden="true"></i><span th:text="#{footballdata.upload}"></span></h2>
							<span class="badge text-bg-secondary" th:text="#{datacreation.testdata.footballdata}"></span>
						</div>
						<div class="card-body">
							<form th:action="@{/administration/upload}" th:object="${footballDataUploadCommand}" method="post" enctype="multipart/form-data" role="form">
								<div class="input-group mb-3">
									<input class="form-control" id="upload" type="file" name="jsonFile" accept="application/json" th:aria-label="#{footballdata.upload}"/>
									<button type="submit" class="btn btn-primary">
										<i class="fas fa-upload" aria-hidden="true"></i> <span th:text="#{footballdata.upload.button}"></span>
									</button>
								</div>
							</form>
							<div class="small text-body-secondary mb-1" th:text="#{datacreation.footballdata.samples}"></div>
							<div class="d-flex flex-wrap gap-2">
								<a class="btn btn-sm btn-outline-secondary" role="button" th:href="@{'/administration/download/template/ec_2024.json'}">
									<i class="fas fa-download" aria-hidden="true"></i> ec_2024.json
								</a>
								<a class="btn btn-sm btn-outline-secondary" role="button" th:href="@{'/administration/download/template/wc_2026.json'}">
									<i class="fas fa-download" aria-hidden="true"></i> wc_2026.json
								</a>
							</div>
						</div>
					</div>
				</div>

				<!-- deleting data -->
				<div class="col-12 col-lg-6">
					<div class="card border-danger h-100">
						<div class="card-header text-danger border-danger">
							<h2 class="h5 mb-0"><i class="fas fa-exclamation-triangle me-2" aria-hidden="true"></i><span th:text="#{datacreation.dangerzone.title}"></span></h2>
						</div>
						<div class="card-body">
							<p class="small text-body-secondary" th:text="#{datacreation.dangerzone.hint}"></p>
							<div class="d-flex flex-wrap gap-2">
								<button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteAllUsers">
									<i class="fas fa-user-times" aria-hidden="true"></i> <span th:text="#{datacreation.deleteAllUsers}"></span>
								</button>
								<button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteAllBetsAndMatches">
									<i class="fas fa-trash-alt" aria-hidden="true"></i> <span th:text="#{datacreation.deleteAllBetsAndMatches}"></span>
								</button>
								<button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteAllBetsMatchesAndTeams">
									<i class="fas fa-trash-alt" aria-hidden="true"></i> <span th:text="#{datacreation.deleteAllBetsMatchesAndTeams}"></span>
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div th:replace="~{fragments/delete_confirm :: delete_confirm_modal(href = '/administration/deleteAllUsers', id='deleteAllUsers')}"></div>
			<div th:replace="~{fragments/delete_confirm :: delete_confirm_modal(href = '/administration/deleteAllBetsAndMatches', id='deleteAllBetsAndMatches')}"></div>
			<div th:replace="~{fragments/delete_confirm :: delete_confirm_modal(href = '/administration/deleteAllBetsMatchesAndTeams', id='deleteAllBetsMatchesAndTeams')}"></div>
		</div>
	</body>
</html>

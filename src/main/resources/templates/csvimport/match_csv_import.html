<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{_layout}">
<head>
    <title th:text="#{csvimport.title}"></title>
</head>
<body>
<div layout:fragment="content" th:with="uploaded=${matchCsvImportCommand.uploaded}">
    <h1 th:text="#{csvimport.title}"></h1>
    <div class="row">
        <div class="col-12 d-flex flex-column gap-3 mb-3">

            <div th:if="${importWarnings}" class="alert alert-warning mb-0">
                <div class="fw-bold" th:text="#{csvimport.msg.warnings}"></div>
                <ul class="mb-0">
                    <li th:each="warning : ${importWarnings}" th:text="${warning}"></li>
                </ul>
            </div>

            <!-- step 1: upload the CSV file -->
            <div class="card">
                <div class="card-header d-flex align-items-center gap-2">
                    <span class="badge rounded-pill text-bg-primary">1</span>
                    <h2 class="h5 mb-0 flex-grow-1" th:text="#{csvimport.step.upload}"></h2>
                    <i th:if="${uploaded}" class="fas fa-check-circle text-success" th:title="#{footballdata.step.done}"></i>
                </div>
                <div class="card-body">
                    <p class="text-body-secondary" th:text="#{csvimport.step.upload.hint}"></p>
                    <form id="csvUploadForm" th:action="@{/csvimport/upload}" method="post" enctype="multipart/form-data" role="form">
                        <div class="input-group">
                            <input class="form-control" id="csvFile" type="file" name="csvFile" accept=".csv,text/csv,text/plain" th:aria-label="#{csvimport.step.upload}"/>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-upload" aria-hidden="true"></i> <span th:text="#{csvimport.upload.button}"></span>
                            </button>
                        </div>
                    </form>
                    <div th:if="${uploaded}" class="small text-body-secondary mt-2">
                        <i class="fas fa-file-csv" aria-hidden="true"></i>
                        <span th:text="#{csvimport.uploaded.file(${matchCsvImportCommand.fileName}, ${matchCsvImportCommand.csvTable.rowCount()})}"></span>
                        <a th:href="@{/csvimport/reset}" class="ms-2" th:text="#{csvimport.reset}"></a>
                    </div>
                </div>
            </div>

            <!-- step 2 + 3: map the columns and import, requires step 1 -->
            <div class="card">
                <div class="card-header d-flex align-items-center gap-2">
                    <span class="badge rounded-pill" th:classappend="${uploaded} ? 'text-bg-primary' : 'text-bg-secondary'">2</span>
                    <h2 class="h5 mb-0 flex-grow-1" th:text="#{csvimport.step.mapping}"></h2>
                    <i th:unless="${uploaded}" class="fas fa-lock text-body-secondary" aria-hidden="true"></i>
                </div>
                <div class="card-body">
                    <div th:unless="${uploaded}" class="alert alert-secondary mb-0" th:text="#{csvimport.step.mapping.locked}"></div>

                    <form th:if="${uploaded}" id="csvMappingForm" th:action="@{/csvimport/import}" th:object="${matchCsvImportCommand}" method="post" role="form">
                        <p class="text-body-secondary">
                            <span th:text="#{csvimport.step.mapping.hint}"></span>
                            <span th:text="#{csvimport.step.mapping.required}"></span>
                            <span th:each="field, stat : ${requiredFields}" class="badge text-bg-light border me-1" th:text="#{${field.msgKey}}"></span>
                        </p>

                        <div th:if="${importErrors}" class="alert alert-danger">
                            <ul class="mb-0">
                                <li th:each="importError : ${importErrors}" th:text="${importError}"></li>
                            </ul>
                        </div>

                        <div class="table-responsive mb-3">
                            <table class="table table-sm table-striped align-middle">
                                <thead>
                                <tr>
                                    <th th:each="header, stat : *{csvTable.headers()}" scope="col" class="text-nowrap">
                                        <div class="small text-body-secondary" th:text="${header}"></div>
                                        <select class="form-select form-select-sm csv-column-mapping" th:field="*{columnMappings[__${stat.index}__]}"
                                                th:aria-label="${header}">
                                            <option value="" th:text="#{csvimport.field.ignore}"></option>
                                            <option th:each="field : ${availableFields}" th:value="${field}" th:text="#{${field.msgKey}}"></option>
                                        </select>
                                    </th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="row : ${previewRows}">
                                    <td th:each="value : ${row}" class="text-nowrap small" th:text="${value}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="small text-body-secondary mb-3" th:if="${matchCsvImportCommand.csvTable.rowCount() > #lists.size(previewRows)}"
                             th:text="#{csvimport.preview.more(${#lists.size(previewRows)}, ${matchCsvImportCommand.csvTable.rowCount()})}"></div>

                        <div class="row mb-3">
                            <div class="col-12 col-md-6 col-lg-4">
                                <label for="dateFormat" class="form-label" th:text="#{csvimport.dateFormat}"></label>
                                <input type="text" id="dateFormat" class="form-control font-monospace" th:field="*{dateFormat}" placeholder="dd.MM.yyyy HH:mm"
                                       autocomplete="off" spellcheck="false"/>
                                <div class="form-text" th:text="#{csvimport.dateFormat.hint}"></div>
                            </div>
                        </div>

                        <div class="d-flex flex-wrap align-items-center gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-file-import" aria-hidden="true"></i> <span th:text="#{csvimport.import.button}"></span>
                            </button>
                            <span class="small text-body-secondary" th:text="#{csvimport.import.hint}"></span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<th:block layout:fragment="scripts">
    <script type="text/javascript" th:src="@{/js/pages/csv_import.js}"></script>
</th:block>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{_layout}">
	<head>
		<title th:text="#{user.edit.title}"></title>
	</head>
	<body>
		<div layout:fragment="content">
			<h1 th:text="#{user.edit.title}"></h1>
			<div th:replace="~{fragments/delete_confirm :: delete_confirm_modal(href = '/user/' + ${editUserCommand.userId} + '/delete', id = 'confirm-delete')}"></div>

			<div class="row">
				<div class="col-12 col-md-8 col-lg-6">
					<form id="userForm" th:action="@{/user/edit}" th:object="${editUserCommand}" method="post" role="form">
						<input type="hidden" th:field="*{userId}" />
						<div class="card mb-3" th:with="roleSelectionDisabled=${@webSecurityUtil.isRoleSelectionDisabledForUser(editUserCommand.username)}">
							<div class="card-body">
								<div th:replace="~{user/user_form :: username(readonly = true)}"></div>
								<div th:replace="~{user/user_form :: roles(disabled = ${roleSelectionDisabled})}"></div>
								<div th:replace="~{user/user_form :: child()}"></div>
							</div>
							<div class="card-footer d-flex flex-wrap gap-2">
								<button type="submit" class="btn btn-primary" th:text="#{button.save}"></button>
								<a th:href="@{/user}" class="btn btn-light" role="button" th:text="#{button.cancel}"></a>
								<div class="col-12 col-sm-auto d-flex flex-wrap gap-2 ms-sm-auto">
									<a th:href="@{'/user/' + ${editUserCommand.userId} + '/resetPwd'}" sec:authorize="hasAuthority('PERM_PASSWORD_RESET')"
									   class="btn btn-outline-warning" role="button" th:text="#{button.password.reset}"></a>
									<button type="button" sec:authorize="hasAuthority('PERM_DELETE_USER')" class="btn btn-outline-danger"
											data-bs-toggle="modal" data-bs-target="#confirm-delete" th:text="#{button.delete}"
											th:disabled="${!editUserCommand.deletable}"></button>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</body>
</html>

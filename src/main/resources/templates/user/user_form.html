<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<body>
		<!--/* Shared form fields of user/create.html and user/edit.html. Expects th:object to be set on the surrounding form. */-->

		<div th:fragment="username(readonly)" class="mb-3">
			<label for="username" class="form-label" th:text="#{user.create.username}"></label>
			<input id="username" type="text" th:field="*{username}" class="form-control" autocomplete="off"
				   th:readonly="${readonly}" maxlength="12"
				   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" />
			<div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
		</div>

		<div th:fragment="password()" class="mb-3">
			<label for="password" class="form-label" th:text="#{user.create.password}"></label>
			<input id="password" type="password" th:field="*{password}" class="form-control" autocomplete="new-password"
				   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" />
			<div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
		</div>

		<!--/* disabled radios are not submitted, so the current roles are sent as hidden fields to pass validation */-->
		<div th:fragment="roles(disabled)" class="mb-3">
			<div class="form-label" th:text="#{user.create.roles}"></div>
			<div class="list-group">
				<label class="list-group-item d-flex align-items-center gap-2" th:each="role : ${availableRoles}"
					   th:classappend="${disabled} ? 'text-body-secondary' : 'list-group-item-action'">
					<input class="form-check-input flex-shrink-0 m-0" type="radio" th:field="*{roles}" th:value="${role}" th:disabled="${disabled}" />
					<span th:text="#{'msg.' + ${role}}"></span>
					<span class="fas fa-info-circle" aria-hidden="true" data-toggle="tooltip" data-bs-placement="top"
						  th:title="#{'user.edit.tooltip.' + ${role}}"></span>
				</label>
			</div>
			<th:block th:if="${disabled}">
				<input type="hidden" name="roles" th:each="role : *{roles}" th:value="${role}" />
			</th:block>
			<div class="invalid-feedback d-block" th:if="${#fields.hasErrors('roles')}" th:errors="*{roles}"></div>
		</div>

		<div th:fragment="child()" class="form-check form-switch">
			<input id="child" class="form-check-input" type="checkbox" role="switch" th:field="*{child}" />
			<label class="form-check-label" for="child" th:text="#{user.create.child}"></label>
			<div class="invalid-feedback d-block" th:if="${#fields.hasErrors('child')}" th:errors="*{child}"></div>
		</div>
	</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{_layout}">
	<head>
		<title th:text="#{user.setting.title}">User Settings</title>
	</head>
	<body>
		<div layout:fragment="content">
            <h1 th:text="#{user.setting.title}">User Settings</h1>
            <div class="row">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <form id="userSettingForm" th:action="@{/setting}" th:object="${userSettingCommand}" action="#" method="post" role="form" class="card mt-3">
                        <div class="card-header">
                            <h2 class="h5 mb-0" th:text="#{administration.runtime.configuration.layout}"></h2>
                        </div>
                        <div class="card-body">
                            <div class="form-check form-switch mb-3">
                                <input id="darkMode" type="checkbox" role="switch" th:field="*{darkMode}" class="form-check-input"/>
                                <label for="darkMode" class="form-check-label" th:text="#{user.setting.darkMode}"></label>
                            </div>

                            <div class="mb-3">
                                <label for="theme" class="form-label fw-bold" th:text="#{administration.runtime.configuration.theme}"></label>
                                <select id="theme" th:field="*{bootswatchTheme}" class="form-select" th:errorclass="is-invalid">
                                    <option th:each="theme : ${availableThemes}" th:value="${theme}"
                                            th:text="${#strings.capitalize(#strings.toLowerCase(theme.name()))}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('bootswatchTheme')}" th:errors="*{bootswatchTheme}"></div>
                            </div>

                            <div>
                                <label for="navbarlayout" class="form-label fw-bold" th:text="#{administration.runtime.configuration.navbarlayout}"></label>
                                <select id="navbarlayout" th:field="*{navbarLayout}" class="form-select" th:errorclass="is-invalid">
                                    <option th:each="navbarLayout : ${availableNavbarLayouts}" th:value="${navbarLayout}"
                                            th:text="${#strings.capitalize(#strings.toLowerCase(navbarLayout.name()))}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('navbarLayout')}" th:errors="*{navbarLayout}"></div>
                            </div>
                        </div>
                        <div class="card-footer d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save" aria-hidden="true"></i> <span th:text="#{button.save}"></span>
                            </button>
                            <a th:href="@{/setting/default}" class="btn btn-outline-secondary" role="button">
                                <i class="fas fa-undo" aria-hidden="true"></i> <span th:text="#{button.default}">Default</span>
                            </a>
                        </div>
                    </form>
                </div>
            </div>
		</div>
	</body>
</html>

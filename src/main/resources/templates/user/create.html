<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{_layout}">
	<head>
		<title th:text="#{user.create.title}"></title>
	</head>
	<body>
		<div layout:fragment="content">
			<h1 th:text="#{user.create.title}"></h1>

			<div class="row">
				<div class="col-12 col-md-8 col-lg-6">
					<form id="userForm" th:action="@{/user}" th:object="${createUserCommand}" method="post" role="form">
						<div class="card mb-3" th:with="roleSelectionDisabled=${@webSecurityUtil.isRoleSelectionDisabledForUser(createUserCommand.username)}">
							<div class="card-body">
								<div th:replace="~{user/user_form :: username(readonly = false)}"></div>
								<div th:replace="~{user/user_form :: password()}"></div>
								<div th:replace="~{user/user_form :: roles(disabled = ${roleSelectionDisabled})}"></div>
								<div th:replace="~{user/user_form :: child()}"></div>
							</div>
							<div class="card-footer d-flex flex-wrap gap-2">
								<button type="submit" class="btn btn-primary" th:text="#{button.save}"></button>
								<a th:href="@{/user}" class="btn btn-light" role="button" th:text="#{button.cancel}"></a>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{_layout}">
<head>
	<title th:text="#{bet.edit.title}"></title>
    <link rel="stylesheet" th:href="@{/css/pages/bet_edit.css}" />
</head>
<body>
	<div layout:fragment="content">
        <h1 th:text="#{bet.edit.heading}"></h1>
        <form id="betForm" th:action="@{/bet}" th:object="${betCommand}" action="#" method="post" role="form" class="goalsEnter">
			<div class="row">
				<div class="col-12 col-sm-8 col-md-6 col-lg-4">
					<input type="hidden" th:field="*{betId}"  />
					<input type="hidden" th:field="*{matchId}"  />
                    <input type="hidden" th:field="*{match}"  />
					<input type="hidden" th:field="*{redirectViewName}"  />
					<input type="hidden" th:field="*{groupMatch}"  />
					<input type="hidden" th:field="*{numberOfJokersUsed}"  />
					<input type="hidden" th:field="*{maxJokers}"  />
					<input type="hidden" th:field="*{jokerEditable}"  />

					<div class="form-group mt-3">
						<div class="row center mb-3">
                            <div th:replace="~{fragments/match_head :: match_head_detail(${betCommand.match})}"></div>
						</div>
						<div class="row center mb-3">
							<div class="col-6">
								<div class="input-group goal-input-group mx-auto">
									<button type="button" class="btn btn-outline-secondary goal-counter" data-team="one" data-step="-1"><i class="fas fa-minus" aria-hidden="true"></i></button>
									<input type="text" inputmode="numeric" th:field="*{goalsTeamOne}" class="form-control text-center fw-bold bg-success-subtle" th:errorclass="is-invalid"/>
									<button type="button" class="btn btn-outline-secondary goal-counter" data-team="one" data-step="1"><i class="fas fa-plus" aria-hidden="true"></i></button>
								</div>
								<div class="text-danger small mt-1" th:if="${#fields.hasErrors('goalsTeamOne')}" th:errors="*{goalsTeamOne}">goalsTeamOne error</div>
							</div>
							<div class="col-6">
								<div class="input-group goal-input-group mx-auto">
									<button type="button" class="btn btn-outline-secondary goal-counter" data-team="two" data-step="-1"><i class="fas fa-minus" aria-hidden="true"></i></button>
									<input type="text" inputmode="numeric" th:field="*{goalsTeamTwo}" class="form-control text-center fw-bold bg-success-subtle" th:errorclass="is-invalid"/>
									<button type="button" class="btn btn-outline-secondary goal-counter" data-team="two" data-step="1"><i class="fas fa-plus" aria-hidden="true"></i></button>
								</div>
								<div class="text-danger small mt-1" th:if="${#fields.hasErrors('goalsTeamTwo')}" th:errors="*{goalsTeamTwo}">goalsTeamTwo error</div>
							</div>
						</div>
						<div id="penaltyBox" class="mb-3" th:if="${!betCommand.isGroupMatch()}">
							<div class="fw-bold mb-2" th:text="#{penalty.box.heading}"></div>
							<div class="btn-group w-100" role="group" th:aria-label="#{penalty.box.heading}">
								<input type="radio" class="btn-check" th:field="*{penaltyWinnerOne}" value="true" autocomplete="off"/>
								<label class="btn btn-outline-primary" th:for="${#ids.prev('penaltyWinnerOne')}"
									   th:text="${betCommand.match.teamOne.getNameTranslated(@messageSourceUtil)}"></label>
								<input type="radio" class="btn-check" th:field="*{penaltyWinnerOne}" value="false" autocomplete="off"/>
								<label class="btn btn-outline-primary" th:for="${#ids.prev('penaltyWinnerOne')}"
									   th:text="${betCommand.match.teamTwo.getNameTranslated(@messageSourceUtil)}"></label>
							</div>
						</div>
						<div th:if="${betCommand.maxJokers gt 0}">
							<div class="row mb-3" th:if="${betCommand.jokerEditable}">
                                <div class="col-10">
                                    <div class="form-check">
                                        <input class="form-check-input" id="useJoker" type="checkbox" th:field="*{useJoker}" th:value="${useJoker}"/>
                                        <label class="form-check-label" for="useJoker" th:text="#{betting.joker}"></label>
                                        <span class="fas fa-info-circle" aria-hidden="true" data-toggle="tooltip" data-bs-placement="top"
                                              th:title="#{betting.joker.tooltip}"></span>
                                    </div>
                                </div>
							</div>
							<div class="form-text mb-3" th:text="#{betting.joker.available(${betCommand.numberOfJokersUsed}, ${betCommand.maxJokers})}"></div>
						</div>
						<div class="row">
							<div class="col-12 d-flex gap-2">
								<button type="submit" class="btn btn-primary" th:text="#{button.save}"></button>
								<button type="button" class="btn btn-info" id="randomDice" th:title="#{bet.edit.dice}" th:aria-label="#{bet.edit.dice}"><i class="fas fa-dice" aria-hidden="true"></i></button>
								<a href="#" th:href="@{${betCommand.getBackUrl()}}" class="btn btn-light" role="button" th:text="#{button.cancel}"></a>
							</div>
						</div>
						<div class="row mt-3">
							<div class="col-12">
								<i class="fas fa-calendar-check" aria-hidden="true"></i>
								<a href="#" th:href="@{'/ics/' + ${betCommand.matchId}}" th:text="#{calendar.ics.download.text}"></a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</form>
	</div>
</body>
<th:block layout:fragment="scripts">
	<script type="text/javascript" th:src="@{/js/pages/bet_and_result.js}" charset="UTF-8"></script>
	<script type="text/javascript" th:src="@{/js/pages/random_dice.js}" charset="UTF-8"></script>
</th:block>
</html>

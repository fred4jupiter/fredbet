<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{_layout}">
	<head>
		<title th:text="#{points.config.title}"></title>
        <link rel="stylesheet" th:href="@{/css/pages/points_config.css}" />
	</head>
	<body>
		<div layout:fragment="content">
            <h1 th:text="#{points.config.title}"></h1>

			<form id="pointsConfigForm" th:action="@{/config/points}" th:object="${pointsConfig}" method="post" role="form">
                <div class="row g-3 mb-3">
                    <div class="col-12 col-lg-6">
                        <div class="card h-100">
                            <div class="card-header">
                                <h2 class="h5 mb-0" th:text="#{points.config.subtitle}"></h2>
                            </div>
                            <ul class="list-group list-group-flush">
                                <li th:replace="~{:: pointsField('pointsCorrectResult', 'pointsCorrectResult', '1. ' + #{points.config.pointsCorrectResult})}"></li>
                                <li th:replace="~{:: pointsField('pointsSameGoalDifference', 'pointsSameGoalDifference', '2. ' + #{points.config.pointsSameGoalDifference})}"></li>
                                <li th:replace="~{:: pointsField('pointsCorrectWinner', 'pointsCorrectWinner', '3. ' + #{points.config.pointsCorrectWinner})}"></li>
                                <li th:replace="~{:: pointsField('pointsCorrectNumberOfGoalsOneTeam', 'pointsCorrectNumberOfGoalsOneTeam', '4. ' + #{points.config.pointsCorrectNumberOfGoalsOneTeam})}"></li>
                            </ul>
                        </div>
                    </div>

                    <div class="col-12 col-lg-6">
                        <div class="card h-100">
                            <div class="card-header">
                                <h2 class="h5 mb-0" th:text="#{points.config.extraBetPoints}"></h2>
                            </div>
                            <ul class="list-group list-group-flush">
                                <li th:replace="~{:: pointsField('pointsFinalWinner', 'extraPointsConfig.pointsFinalWinner', #{points.config.pointsFinalWinner.title})}"></li>
                                <li th:replace="~{:: pointsField('pointsSemiFinalWinner', 'extraPointsConfig.pointsSemiFinalWinner', #{points.config.pointsSemiFinalWinner.title})}"></li>
                                <li th:replace="~{:: pointsField('pointsThirdFinalWinner', 'extraPointsConfig.pointsThirdFinalWinner', #{points.config.pointsThirdFinalWinner.title})}"></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="d-grid gap-2 d-sm-flex">
                    <button type="submit" class="btn btn-primary" th:text="#{button.save}"></button>
                    <a th:href="@{/config/points/reset}" class="btn btn-info" role="button" th:text="#{points.config.reset.defaults}"></a>
                    <a th:href="@{/matches/today}" class="btn btn-light" role="button" th:text="#{button.cancel}"></a>
                </div>
			</form>

            <!--/* one row per points value: label on the left, small number input on the right */-->
            <th:block th:remove="all">
                <li th:fragment="pointsField(id, field, label)" class="list-group-item">
                    <div class="d-flex align-items-center justify-content-between gap-3">
                        <label class="form-label mb-0" th:for="${id}" th:text="${label}"></label>
                        <input th:id="${id}" type="number" min="0" step="1" inputmode="numeric" required="required"
                               class="form-control points-input flex-shrink-0" th:field="*{__${field}__}"
                               th:classappend="${#fields.hasErrors(field)} ? 'is-invalid'" />
                    </div>
                    <div class="invalid-feedback d-block text-end" th:if="${#fields.hasErrors(field)}" th:errors="*{__${field}__}"></div>
                </li>
            </th:block>
		</div>
	</body>
</html>

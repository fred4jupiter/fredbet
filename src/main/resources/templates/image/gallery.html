<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{_layout}">
	<head>
		<title th:text="#{image.gallery.title}"></title>
        <link rel="stylesheet" th:href="@{/css/pages/gallery.css}" />
	</head>
	<body>
		<div layout:fragment="content">
			<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
				<h1 class="mb-0" th:text="#{image.gallery.title}"></h1>
				<a th:href="@{/image/show}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> <span th:text="#{image.gallery.toUploadImagePage}"></span>
                </a>
			</div>

			<div class="row mb-3">
				<div class="col-12">
					<!-- the links are opened with the image viewer in gallery.js, the title is shown as caption -->
					<div id="links">
						<div th:id="${galleryGroup}" th:each="galleryGroup : ${groupedImageCommands.keySet()}">
							<span class="fw-bold" th:text="${galleryGroup}"></span><br/>
							<a th:each="imageCommand : ${groupedImageCommands.get(galleryGroup)}" th:href="@{'/gallery/show/' + ${imageCommand.imageKey}}"
										th:title="${imageCommand.description}"><img th:src="@{'/gallery/showthumb/' + ${imageCommand.imageKey}}" th:alt="${imageCommand.imageKey}"
                                     class="rounded img-responsive mt-2 me-2 mb-2"/></a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
	<th:block layout:fragment="scripts">
		<script type="text/javascript" th:src="@{/js/pages/gallery.js}"></script>
	</th:block>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{_layout}">
	<head>
		<title th:text="#{standings.title}"></title>
	</head>
	<body>
		<div layout:fragment="content" th:with="columns=${ {'matchesPlayed', 'wins', 'draws', 'losses', 'goals', 'goalDifference', 'points'} }">
			<h1 th:text="#{standings.title}"></h1>
			<div class="row">
				<th:block th:each="group : ${standingsContainer.groups}" th:with="groupStandings=${standingsContainer.getForGroup(group)}">
					<div class="col-12 col-sm-6 mb-3" th:unless="${#lists.isEmpty(groupStandings)}">
						<h2 th:text="#{${group.getTitleMsgKey()}}"></h2>
						<div class="table-responsive">
							<table class="table small table-sm table-striped">
								<thead class="table-light">
									<tr>
										<th>#</th>
										<th th:text="#{standings.team}"></th>
										<th th:each="column : ${columns}">
											<abbr th:title="#{${'standings.' + column}}" th:text="#{${'standings.abbr.' + column}}"></abbr>
										</th>
									</tr>
								</thead>
								<tbody>
									<tr th:classappend="${teamStandings.getCssClass(iter.count)}" th:each="teamStandings,iter : ${groupStandings}">
										<td th:text="${iter.count}"></td>
										<td th:text="${teamStandings.getTeam().getNameTranslated(@messageSourceUtil)}"></td>
										<td th:text="${teamStandings.numberOfMatches}"></td>
										<td th:text="${teamStandings.numberOfWins}"></td>
										<td th:text="${teamStandings.numberOfUndecided}"></td>
										<td th:text="${teamStandings.numberOfLooses}"></td>
										<td th:text="${teamStandings.numberOfGoals} + ':' + ${teamStandings.numberOfGoalsAgainst}"></td>
										<td th:text="${teamStandings.numberOfGoalDifference}"></td>
										<td class="fw-bold" th:text="${teamStandings.numberOfPoints}"></td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</th:block>
			</div>
			<p class="small text-body-secondary">
				<th:block th:each="column, iter : ${columns}">
					<span class="text-nowrap"><strong th:text="#{${'standings.abbr.' + column}}"></strong> = <span th:text="#{${'standings.' + column}}"></span></span><span th:unless="${iter.last}"> · </span>
				</th:block>
			</p>
		</div>
	</body>
</html>

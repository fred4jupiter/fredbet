<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <title th:text="#{pointcourse.title}"></title>
    <link rel="stylesheet" th:href="@{/css/pages/pointcourse.css}" />
</head>
<body>
<div layout:fragment="content">
    <h1 th:text="#{pointcourse.title}"></h1>
    <p class="text-body-secondary" th:text="#{pointcourse.subtitle}"></p>

    <div class="card" th:if="${chartJson}">
        <div class="card-body">
            <div class="pointcourse-chart">
                <canvas id="pointCourseChart" th:data-chart="${chartJson}"></canvas>
            </div>
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <th:block th:if="${chartJson}">
        <script type="text/javascript" th:src="@{/js/Chart.bundle.min.js}"></script>
        <script type="text/javascript" th:src="@{/js/chartjs-plugin-colorschemes.min.js}"></script>
        <script type="text/javascript" th:src="@{/js/pages/pointcourse.js}"></script>
    </th:block>
</th:block>
</body>
</html>

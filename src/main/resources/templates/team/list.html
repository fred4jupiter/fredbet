<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{_layout}">
<head>
    <title th:text="#{team.list.title}"></title>
    <link rel="stylesheet" th:href="@{/css/pages/team.css}" />
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <h1 class="mb-0" th:text="#{team.list.title} + ' (' + ${allTeams.size()} + ')'"></h1>
        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/teams/create}" class="btn btn-primary" role="button">
                <i class="fas fa-plus"></i> <span th:text="#{team.list.createTeam}"></span>
            </a>
            <button th:unless="${allTeams.isEmpty()}" type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#confirmDeleteAllTeams">
                <i class="fas fa-trash"></i> <span th:text="#{team.list.deleteAllTeams}"></span>
            </button>
        </div>
    </div>

    <div th:unless="${allTeams.isEmpty()}" class="modal fade" id="confirmDeleteAllTeams" tabindex="-1" aria-labelledby="confirmDeleteAllTeamsLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="confirmDeleteAllTeamsLabel" th:text="#{confirmation.msg}"></h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{button.cancel}"></button>
                </div>
                <div class="modal-body" th:text="#{team.list.deleteAllTeams.hint}"></div>
                <div class="modal-footer">
                    <form th:action="@{/teams/deleteAll}" method="post">
                        <button type="submit" class="btn btn-danger" th:text="#{team.list.deleteAllTeams}"></button>
                    </form>
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal" th:text="#{button.cancel}"></button>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/teams/bundle}" method="post" role="form">
                <label class="form-label" for="teamBundle" th:text="#{team.bundle.label} + ':'"></label>
                <div class="row g-2">
                    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                        <select id="teamBundle" name="teamBundle" class="form-select" required aria-describedby="teamBundleHelp">
                            <option value="" th:text="#{country.none}"></option>
                            <option th:each="teamBundle : ${availableTeamBundles}" th:value="${teamBundle}" th:text="#{${'teamBundle.' + teamBundle}}"></option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-auto">
                        <button type="submit" class="btn btn-secondary w-100">
                            <i class="fas fa-layer-group"></i> <span th:text="#{team.bundle.button}"></span>
                        </button>
                    </div>
                </div>
                <div id="teamBundleHelp" class="form-text" th:text="#{team.bundle.hint}"></div>
            </form>
        </div>
    </div>

    <div class="row mb-3" th:unless="${allTeams.isEmpty()}">
        <div class="col-12 col-md-6 col-lg-4">
            <input id="teamFilter" type="search" class="form-control" th:placeholder="#{team.list.filter}" th:aria-label="#{team.list.filter}" />
        </div>
    </div>

    <p class="text-body-secondary" th:if="${allTeams.isEmpty()}" th:text="#{team.list.noTeams}"></p>

    <div class="row g-3" id="teamList">
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3 team-entry" th:each="team : ${allTeams}" th:id="${'team-' + team.id}"
             th:with="teamName=${team.getNameTranslated(@messageSourceUtil)}" th:data-team-name="${teamName}">
            <div class="card h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <img class="team-crest flex-shrink-0" th:src="@{${'/team/' + team.id + '.svg'}(v=${team.version})}" th:alt="${teamName}" loading="lazy" />
                    <div class="flex-grow-1 text-truncate">
                        <div class="d-flex align-items-center gap-1">
                            <div class="fw-bold text-truncate" th:text="${teamName}" th:title="${teamName}"></div>
                            <i th:if="${team.favourite}" class="fas fa-star text-warning flex-shrink-0" th:title="#{team.form.favourite}" aria-hidden="true"></i>
                            <span th:if="${team.favourite}" class="visually-hidden" th:text="#{team.form.favourite}"></span>
                        </div>
                        <span th:if="${team.teamBundleEntry != null}" class="badge text-bg-secondary" th:text="#{team.type.teamBundleEntry}"></span>
                        <span th:if="${team.teamBundleEntry == null}" class="badge text-bg-info" th:text="#{team.type.name}"></span>
                    </div>
                    <a th:href="@{'/teams/' + ${team.id}}" class="btn btn-primary flex-shrink-0" role="button" th:title="#{button.edit}" th:aria-label="#{button.edit}">
                        <span class="fas fa-edit"></span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script type="text/javascript" th:src="@{/js/pages/team.js}" charset="UTF-8"></script>
</th:block>
</body>
</html>

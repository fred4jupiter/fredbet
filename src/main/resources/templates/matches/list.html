<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{_layout}">
<head>
	<title th:text="${heading}"></title>
    <link rel="stylesheet" th:href="@{/css/pages/matches_list.css}" />
</head>
<body>
	<div layout:fragment="content">
		<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
			<h1 class="mb-0" th:text="${heading} + ' (' + ${#lists.size(allMatches)} + ')'"></h1>
			<div class="d-flex flex-wrap gap-2">
				<!-- always exports all matches with the own bets, independent of the current filter -->
				<a th:href="@{/matches/pdf}" class="btn btn-outline-secondary" role="button" th:title="#{pdf.export.myBets.button}">
					<i class="fas fa-file-pdf" aria-hidden="true"></i> <span th:text="#{pdf.export.myBets.button}"></span>
				</a>
				<a sec:authorize="hasAuthority('PERM_CREATE_MATCH')" th:href="@{/match/create}" class="btn btn-primary" role="button">
					<i class="fas fa-plus"></i> <span th:text="#{matches.list.createMatch}"></span>
				</a>
			</div>
		</div>
			<div class="row">
				<div class="col-12 col-sm-8 col-md-6 col-lg-4 mb-3" th:each="matchCommand : ${allMatches}">
					<a class="anchor" th:id="${matchCommand.match.id}"></a>
					<div class="card h-100">
						<div class="card-header">
							<div>
                                <div th:replace="~{fragments/match_head :: match_head_list(${matchCommand.match})}"></div>
							</div>
							<div th:text="${#temporals.format(matchCommand.match.kickOffDate, 'EEE dd. MMMM yyyy HH:mm')}"></div>
							<div class="group-label" th:text="${matchCommand.match.getGroupLabel(@messageSourceUtil)}"></div>
						</div>
						<div class="card-body d-flex flex-nowrap align-items-center justify-content-center gap-2">
							<div class="score-group">
								<a th:if="${!matchCommand.match.isBettable()}" th:href="@{'/bet/others/match/' + ${matchCommand.match.id} + '?redirectViewName=' + ${redirectViewName}}">
									<span class="fas fa-thumbs-up fa-lg" th:title="#{matches.list.betted}" data-toggle="tooltip" data-bs-placement="top"></span>
								</a>
								<span th:if="${matchCommand.match.isBettable()}" class="fas fa-thumbs-up fa-lg" th:title="#{matches.list.betted}" data-toggle="tooltip" data-bs-placement="top"></span>
								<span class="badge rounded-pill bg-success big-badge" th:classappend="${matchCommand.getUserBetGoalsTeamOneCssClasses()}"
								      th:text="${matchCommand.bet?.goalsTeamOne != null ? matchCommand.bet?.goalsTeamOne : '?'}"></span>
								<span>:</span>
								<span class="badge rounded-pill bg-success big-badge" th:classappend="${matchCommand.getUserBetGoalsTeamTwoCssClasses()}"
								      th:text="${matchCommand.bet?.goalsTeamTwo != null ? matchCommand.bet?.goalsTeamTwo : '?'}"></span>
							</div>
							<div class="score-group">
                                <span class="fas fa-trophy fa-lg" th:title="#{matches.list.result}" data-toggle="tooltip" data-bs-placement="top"></span>
                                <span class="badge rounded-pill bg-info big-badge" th:classappend="${matchCommand.getTeamResultOneCssClasses()}"
								      th:text="${matchCommand.match.goalsTeamOne != null ? matchCommand.match.goalsTeamOne : '?'}"></span>
								<span>:</span>
								<span class="badge rounded-pill bg-info big-badge" th:classappend="${matchCommand.getTeamResultTwoCssClasses()}"
								      th:text="${matchCommand.match.goalsTeamTwo != null ? matchCommand.match.goalsTeamTwo : '?'}"></span>
							</div>
							<div class="score-group">
								<span th:replace="~{fragments/points_badge :: points_badge(${matchCommand.pointsBadge})}"></span>
							</div>
						</div>
						<div class="card-footer d-flex justify-content-center gap-2">
							<a sec:authorize="hasAuthority('PERM_EDIT_MATCH')" th:href="@{'/match/' + ${matchCommand.match.id}}"
							   class="btn btn-primary" role="button" th:title="#{matches.list.editMatch}">
								<span class="fas fa-edit"></span>
							</a>
							<a th:href="@{'/bet/createOrUpdate/' + ${matchCommand.match.id} + '?redirectViewName=' + ${redirectViewName}}" th:classappend="${!matchCommand.match.isBettable()}? 'disabled'"
							   class="btn btn-success" role="button" th:title="#{matches.list.betMatch}">
								<span class="fas fa-thumbs-up"></span>
							</a>
							<a sec:authorize="hasAuthority('PERM_EDIT_MATCH_RESULT')" th:href="@{'/matchresult/' + ${matchCommand.match.id} + '?redirectViewName=' + ${redirectViewName}}"
							   class="btn btn-info" role="button" th:title="#{matches.list.enterResult}">
								<span class="fas fa-trophy"></span>
							</a>
							<button sec:authorize="hasAuthority('PERM_ADMINISTRATION')" type="button" class="btn btn-secondary"
									data-bs-toggle="modal" data-bs-target="#match-info" th:title="#{matches.list.info}"
									th:attr="data-external-last-updated=${matchCommand.externalLastUpdated},data-create-date=${matchCommand.createDate},data-created-by=${matchCommand.match.createdBy},data-update-date=${matchCommand.updateDate},data-updated-by=${matchCommand.match.updatedBy}">
								<span class="bi bi-info-circle"></span>
							</button>
						</div>
					</div>
				</div>
			</div>
			<div sec:authorize="hasAuthority('PERM_ADMINISTRATION')" class="modal fade" id="match-info" tabindex="-1" aria-labelledby="match-info-title" aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header">
							<h1 class="modal-title fs-5" id="match-info-title"><i class="bi bi-info-circle me-2" aria-hidden="true"></i><span th:text="#{matches.list.info}"></span></h1>
							<button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{button.close}"></button>
						</div>
						<div class="modal-body p-0">
							<dl class="list-group list-group-flush mb-0">
								<div class="list-group-item d-flex justify-content-between align-items-center gap-3">
									<dt class="fw-normal text-body-secondary"><i class="fas fa-sync-alt fa-fw me-2" aria-hidden="true"></i><span th:text="#{matches.list.info.externalLastUpdated}"></span></dt>
									<dd class="mb-0 fw-semibold text-end" data-field="externalLastUpdated"></dd>
								</div>
								<div class="list-group-item d-flex justify-content-between align-items-center gap-3">
									<dt class="fw-normal text-body-secondary"><i class="fas fa-calendar-plus fa-fw me-2" aria-hidden="true"></i><span th:text="#{matches.list.info.createDate}"></span></dt>
									<dd class="mb-0 fw-semibold text-end" data-field="createDate"></dd>
								</div>
								<div class="list-group-item d-flex justify-content-between align-items-center gap-3">
									<dt class="fw-normal text-body-secondary"><i class="fas fa-user fa-fw me-2" aria-hidden="true"></i><span th:text="#{matches.list.info.createdBy}"></span></dt>
									<dd class="mb-0 fw-semibold text-end" data-field="createdBy"></dd>
								</div>
								<div class="list-group-item d-flex justify-content-between align-items-center gap-3">
									<dt class="fw-normal text-body-secondary"><i class="fas fa-calendar-check fa-fw me-2" aria-hidden="true"></i><span th:text="#{matches.list.info.updateDate}"></span></dt>
									<dd class="mb-0 fw-semibold text-end" data-field="updateDate"></dd>
								</div>
								<div class="list-group-item d-flex justify-content-between align-items-center gap-3">
									<dt class="fw-normal text-body-secondary"><i class="fas fa-user-edit fa-fw me-2" aria-hidden="true"></i><span th:text="#{matches.list.info.updatedBy}"></span></dt>
									<dd class="mb-0 fw-semibold text-end" data-field="updatedBy"></dd>
								</div>
							</dl>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{button.close}"></button>
						</div>
					</div>
				</div>
			</div>
	</div>
<th:block layout:fragment="scripts">
	<script type="text/javascript" th:src="@{/js/pages/matches_list.js}" charset="UTF-8"></script>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{_layout}">
<head>
	<title th:text="#{matches.matchresult.title}"></title>
    <link rel="stylesheet" th:href="@{/css/pages/matchresult.css}" />
</head>
<body>
	<div layout:fragment="content">
        <h1 th:text="#{matchresult.heading}"></h1>
		<form id="matchresultForm" th:action="@{/matchresult}" th:object="${matchResultCommand}" action="#" method="post" role="form">
            <div class="alert alert-danger" th:if="${#fields.hasErrors('global')}" th:errors="*{global}"></div>
			<div class="row">
				<div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
					<input type="hidden" th:field="*{matchId}" />
                    <input type="hidden" th:field="*{match}" />
					<input type="hidden" th:field="*{redirectViewName}" />
					<input type="hidden" th:field="*{knockoutMatch}" />

                    <div class="form-group mt-3">
						<div class="match-head mb-3">
							<div class="card">
								<div class="card-body match-head-team">
									<div th:replace="~{fragments/match_head :: match_head_team(${matchResultCommand.match.teamOne})}"></div>
									<div class="input-group goal-input-group mt-auto">
										<button type="button" tabindex="-1" class="btn btn-outline-secondary goal-counter" data-team="one" data-step="-1"><i class="fas fa-minus" aria-hidden="true"></i></button>
										<input type="text" inputmode="numeric" th:field="*{teamResultOne}" autofocus="autofocus" class="form-control text-center fw-bold bg-info-subtle" th:errorclass="is-invalid"/>
										<button type="button" tabindex="-1" class="btn btn-outline-secondary goal-counter" data-team="one" data-step="1"><i class="fas fa-plus" aria-hidden="true"></i></button>
									</div>
									<div class="text-danger small" th:if="${#fields.hasErrors('teamResultOne')}" th:errors="*{teamResultOne}">teamResultOne error</div>
								</div>
							</div>
							<span class="match-head-separator" aria-hidden="true">:</span>
							<div class="card">
								<div class="card-body match-head-team">
									<div th:replace="~{fragments/match_head :: match_head_team(${matchResultCommand.match.teamTwo})}"></div>
									<div class="input-group goal-input-group mt-auto">
										<button type="button" tabindex="-1" class="btn btn-outline-secondary goal-counter" data-team="two" data-step="-1"><i class="fas fa-minus" aria-hidden="true"></i></button>
										<input type="text" inputmode="numeric" th:field="*{teamResultTwo}" class="form-control text-center fw-bold bg-info-subtle" th:errorclass="is-invalid"/>
										<button type="button" tabindex="-1" class="btn btn-outline-secondary goal-counter" data-team="two" data-step="1"><i class="fas fa-plus" aria-hidden="true"></i></button>
									</div>
									<div class="text-danger small" th:if="${#fields.hasErrors('teamResultTwo')}" th:errors="*{teamResultTwo}">teamResultTwo error</div>
								</div>
							</div>
						</div>
						<div id="penaltyBox" class="mb-3" th:if="${matchResultCommand.isKnockoutMatch()}">
							<div class="fw-bold mb-2" th:text="#{penalty.box.heading}"></div>
							<div class="btn-group w-100" role="group" th:aria-label="#{penalty.box.heading}">
								<input type="radio" class="btn-check" th:field="*{penaltyWinnerOne}" value="true" autocomplete="off"/>
								<label class="btn btn-outline-primary" th:for="${#ids.prev('penaltyWinnerOne')}"
									   th:text="${matchResultCommand.match.teamOne.getNameTranslated(@messageSourceUtil)}"></label>
								<input type="radio" class="btn-check" th:field="*{penaltyWinnerOne}" value="false" autocomplete="off"/>
								<label class="btn btn-outline-primary" th:for="${#ids.prev('penaltyWinnerOne')}"
									   th:text="${matchResultCommand.match.teamTwo.getNameTranslated(@messageSourceUtil)}"></label>
							</div>
						</div>
						<div class="row">
							<div class="col-12 d-flex gap-2">
								<button type="submit" class="btn btn-primary" th:text="#{button.save}"></button>
								<a href="#" th:href="@{${matchResultCommand.getBackUrl()}}" class="btn btn-light" role="button" th:text="#{button.cancel}"></a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</form>
	</div>
</body>
<th:block layout:fragment="scripts">
	<script type="text/javascript" th:src="@{/js/pages/bet_and_result.js}" charset="UTF-8"></script>
</th:block>
</html>

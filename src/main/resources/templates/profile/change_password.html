<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{_layout}">
<head>
	<title th:text="#{userprofile.changePassword.title}"></title>
</head>
<body>
    <div layout:fragment="content">
        <h1 th:text="#{userprofile.changePassword.title}"></h1>
        <div class="row">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <form id="changePasswordForm" th:action="@{/profile/changePassword}" th:object="${changePasswordCommand}" action="#" method="post" role="form" class="card mt-3">
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="oldPassword" class="form-label fw-bold" th:text="#{userprofile.changePassword.oldPassword}"></label>
                            <input id="oldPassword" type="password" th:field="*{oldPassword}" class="form-control" th:errorclass="is-invalid"
                                   autocomplete="current-password" required autofocus />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-bold" th:text="#{userprofile.changePassword.newPassword}"></label>
                            <input id="newPassword" type="password" th:field="*{newPassword}" class="form-control" th:errorclass="is-invalid"
                                   autocomplete="new-password" required minlength="4" maxlength="100" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>
                        <div>
                            <label for="newPasswordRepeat" class="form-label fw-bold" th:text="#{userprofile.changePassword.newPasswordRepeat}"></label>
                            <input id="newPasswordRepeat" type="password" th:field="*{newPasswordRepeat}" class="form-control" th:errorclass="is-invalid"
                                   autocomplete="new-password" required minlength="4" maxlength="100" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPasswordRepeat')}" th:errors="*{newPasswordRepeat}"></div>
                        </div>
                    </div>
                    <div class="card-footer d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save" aria-hidden="true"></i> <span th:text="#{button.save}"></span>
                        </button>
                        <a th:href="@{/}" class="btn btn-light" role="button" th:text="#{button.cancel}"></a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>

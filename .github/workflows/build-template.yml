name: Build and Test Template

on:
  workflow_call:
    inputs:
      maven_command:
        required: true
        type: string
      upload_artifact:
        required: true
        type: boolean
      java_version:
        required: false
        type: string
        default: '25'
      static_code_analysis:
        description: "Run the static code analysis (PMD). Issues are reported, but never break the build."
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write # test report
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: ${{ inputs.maven_command }}
      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
      - name: Static code analysis (PMD)
        if: ${{ inputs.static_code_analysis }}
        continue-on-error: true
        run: mvn -B pmd:pmd
      - name: Publish static code analysis results
        if: ${{ inputs.static_code_analysis }}
        continue-on-error: true
        run: python3 .github/scripts/pmd-report.py target/pmd.xml
      - name: Upload static code analysis report
        if: ${{ inputs.static_code_analysis }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pmd-report
          path: target/pmd.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload jar file
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: fredbet.jar
          path: target/fredbet.jar
          retention-days: 1

name: Build and Test Template

on:
  workflow_call:
    inputs:
      maven_command:
        required: true
        type: string
      upload_artifact:
        required: true
        type: boolean
      java_version:
        required: false
        type: string
        default: '25'
      static_code_analysis:
        description: "Run the static code analysis (PMD). Issues are reported, but never break the build."
        required: false
        type: boolean
        default: false
    outputs:
      jar_file_id:
        description: "The id of the uploaded fredbet.jar file"
        value: ${{ jobs.build.outputs.jar-file-id }}
  #    secrets:
#      personal_access_token:
#        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      jar-file-id: ${{ steps.fredbet-jar-artifact.outputs.artifact-id }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'temurin'
      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build with Maven
        run: ${{ inputs.maven_command }}
      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
      - name: Static code analysis (PMD)
        if: ${{ inputs.static_code_analysis }}
        continue-on-error: true
        run: mvn -B pmd:pmd
      - name: Publish static code analysis results
        if: ${{ inputs.static_code_analysis }}
        continue-on-error: true
        run: python3 .github/scripts/pmd-report.py target/pmd.xml
      - name: Upload static code analysis report
        if: ${{ inputs.static_code_analysis }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pmd-report
          path: target/pmd.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload jar file
        if: ${{ inputs.upload_artifact }}
        id: fredbet-jar-artifact
        uses: actions/upload-artifact@v7
        with:
          name: fredbet.jar
          path: target/fredbet.jar
          retention-days: 1
      - name: Output artifact ID
        if: ${{ inputs.upload_artifact }}
        run: echo 'Artifact ID is ${{ steps.fredbet-jar-artifact.outputs.artifact-id }}'

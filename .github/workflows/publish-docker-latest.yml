name: Publish Docker latest image

on:
  push:
    paths-ignore:
      - '.github/**'
      - 'extra/**'
    branches:
      - 'master'

# only the newest master commit may publish 'latest'; an older, slower run must not overwrite it
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-template.yml
    permissions:
      contents: read
      actions: read
      checks: write
    with:
      maven_command: 'mvn -B verify'
      upload_artifact: true
  docker:
    needs: build
    uses: ./.github/workflows/docker-template.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: latest
      push_to_docker_hub: true
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

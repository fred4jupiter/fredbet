name: Publish Manual Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'The application release version'
        required: true

# never run two releases at the same time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check_version:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the release tag already exists
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/${RELEASE_VERSION}" > /dev/null; then
            echo "::error::Tag ${RELEASE_VERSION} already exists. Choose a new release version."
            exit 1
          fi
  build:
    needs: check_version
    uses: ./.github/workflows/build-template.yml
    permissions:
      contents: read
      actions: read
      checks: write
    with:
      maven_command: 'mvn -Drevision=${{ inputs.release_version }} -B verify'
      upload_artifact: true
  docker:
    needs: build
    uses: ./.github/workflows/docker-template.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: ${{ inputs.release_version }}
      push_to_docker_hub: true
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  release:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version }}
          target_commitish: ${{ github.sha }} # tag the commit that was built, not the current head of master
          draft: false
          prerelease: false
          generate_release_notes: true # GitHub release notes from merged PRs since the last release, grouped via .github/release.yml

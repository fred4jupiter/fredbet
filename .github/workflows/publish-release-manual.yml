name: Publish Manual Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'The application release version'
        required: true

jobs:
  check_version:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the release tag already exists
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/${RELEASE_VERSION}" > /dev/null; then
            echo "::error::Tag ${RELEASE_VERSION} already exists. Choose a new release version."
            exit 1
          fi
  build:
    needs: check_version
    uses: ./.github/workflows/build-template.yml
    with:
      maven_command: 'mvn -Drevision=${{ github.event.inputs.release_version }} -B verify'
      upload_artifact: true
  docker:
    runs-on: ubuntu-latest
    needs: build
    env:
      DOCKER_IMAGE: fred4jupiter/fredbet
      DOCKER_TARGET_PLATFORM: linux/arm64/v8,linux/amd64
#    outputs:
#      release_version: ${{steps.version_update.outputs.release-version}} # use in jobs: ${{needs.build_tag_repo.outputs.release_version}}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Download jar file
        uses: actions/download-artifact@v8
        with:
          name: fredbet.jar
          path: target
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          docker buildx build \
            --platform ${DOCKER_TARGET_PLATFORM} \
            --tag docker.io/${DOCKER_IMAGE}:${{ github.event.inputs.release_version }} \
            --tag ghcr.io/${DOCKER_IMAGE}:${{ github.event.inputs.release_version }} \
            --file ./Dockerfile \
            --output type=image,push=true .
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{github.event.inputs.release_version}}
          target_commitish: ${{ github.sha }} # tag the commit that was built, not the current head of master
          draft: false
          prerelease: false
          generate_release_notes: true # GitHub release notes from merged PRs since the last release, grouped via .github/release.yml

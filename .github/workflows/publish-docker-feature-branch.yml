name: Publish Docker feature branch

on:
  workflow_dispatch:
    inputs:
      static_code_analysis:
        description: 'Run static code analysis (PMD)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-template.yml
    permissions:
      contents: read
      actions: read
      checks: write
    with:
      maven_command: 'mvn -B verify'
      upload_artifact: true
      static_code_analysis: ${{ inputs.static_code_analysis }}
  docker_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.docker_tag.outputs.tag }}
    steps:
      - name: Determine Docker tag
        id: docker_tag
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # e.g. feature/Extra-Bets -> feature-extra-bets-e69a3a9
          branch_part=$(echo "${BRANCH_NAME}" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[-.]+//' | cut -c1-100 | sed -E 's/[-.]+$//')
          short_sha="${GITHUB_SHA::7}"
          docker_tag="${branch_part:+${branch_part}-}${short_sha}"
          echo "tag=${docker_tag}" >> "$GITHUB_OUTPUT"
          echo "Docker tag: \`ghcr.io/fred4jupiter/fredbet:${docker_tag}\`" >> "$GITHUB_STEP_SUMMARY"
  docker:
    needs: [build, docker_tag]
    uses: ./.github/workflows/docker-template.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: ${{ needs.docker_tag.outputs.tag }}

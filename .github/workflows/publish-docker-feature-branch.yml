name: Publish Docker feature branch

on:
  workflow_dispatch:
    inputs:
      static_code_analysis:
        description: 'Run static code analysis (PMD)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/build-template.yml
    with:
      maven_command: 'mvn -B verify'
      upload_artifact: true
      static_code_analysis: ${{ inputs.static_code_analysis }}
  docker:
    runs-on: ubuntu-latest
    needs: build
    env:
      DOCKER_IMAGE: fred4jupiter/fredbet
      DOCKER_TARGET_PLATFORM: linux/arm64/v8,linux/amd64
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Determine Docker tag
        id: docker_tag
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # e.g. feature/Extra-Bets -> feature-extra-bets-e69a3a9
          branch_part=$(echo "${BRANCH_NAME}" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[-.]+//' | cut -c1-100 | sed -E 's/[-.]+$//')
          short_sha="${GITHUB_SHA::7}"
          docker_tag="${branch_part:+${branch_part}-}${short_sha}"
          echo "tag=${docker_tag}" >> "$GITHUB_OUTPUT"
          echo "Docker tag: \`ghcr.io/${DOCKER_IMAGE}:${docker_tag}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Download jar file
        uses: actions/download-artifact@v8
        with:
          name: fredbet.jar
          path: target
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push image
        env:
          DOCKER_TAG: ${{ steps.docker_tag.outputs.tag }}
        run: |
          docker buildx build \
            --platform ${DOCKER_TARGET_PLATFORM} \
            --tag ghcr.io/${DOCKER_IMAGE}:${DOCKER_TAG} \
            --file ./Dockerfile \
            --output type=image,push=true .
